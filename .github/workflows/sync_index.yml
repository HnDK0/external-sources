name: Sync index.yaml

# Запускается на push в ЛЮБУЮ ветку (не только main), чтобы index.yaml
# пересобирался и на тестовых ветках. Также подставляет в README.md имя
# текущей ветки в Plugin Index URL (на main — no-op). Один коммит с [skip ci],
# чтобы не было петли и чтобы не гоняться за push-ем с другими воркфлоу.

on:
  push:
    branches:
      - "**"
  workflow_dispatch: # ручной запуск из UI

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run sync
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python scripts/sync_index.py .

      - name: Commit & push
        run: |
          git diff --quiet && exit 0
          git config user.name  "${{ github.actor }}"
          git config user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"
          git add "index.yaml" "*/index.yaml" "README.md"
          git commit -m "chore: sync index.yaml & README [skip ci]"
          git push
